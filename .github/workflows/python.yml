name: Python

on:
  push:
    branches: [main]
    paths:
      - bindings/python/**
      - crates/**/*.rs
      - pyproject.toml
      - .github/workflows/python.yml
    tags:
      - 'rf24-py/*'
  pull_request:
    branches: [main]
    paths:
      - bindings/python/**
      - crates/**/*.rs
      - pyproject.toml
      - .github/workflows/python.yml
  workflow_dispatch:

permissions: {}

jobs:
  wheels:
    runs-on: ${{ matrix.platform.runner }}
    name: >-
      wheels (${{ matrix.python.feature }},
      ${{ matrix.platform.runner }},
      ${{ matrix.platform.manylinux || 'manylinux'}}
      ${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: '3.10'
            feature: pyo3/abi3-py310
          - version: '3.15t'
            feature: pyo3/abi3t-py315
        platform:
          - runner: windows-latest
            target: x64
            py-arch: x64
          - runner: windows-latest
            target: x86
            py-arch: x86
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: x86
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: armv7
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
        include:
          # insert these manually until python 3.11 is the minimum supported python version
          - python:
              version: '3.11'
              feature: pyo3/abi3-py311
            platform:
              runner: windows-11-arm
              target: aarch64
              py-arch: arm64
          - python:
              version: '3.15t'
              feature: pyo3/abi3t-py315
            platform:
              runner: windows-11-arm
              target: aarch64
              py-arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        id: setup-python
        with:
          python-version: ${{ matrix.python.version }}
          architecture: ${{ matrix.platform.py-arch || null }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.python.version }}
            --features ${{ matrix.python.feature }}
            ${{ runner.os == 'Linux' && matrix.platform.target != 'ppc64le' && '--zig' || '' }}
          working-directory: bindings/python
          # zizmor: ignore[cache-poisoning]
          sccache: ${{ startsWith(github.ref, 'refs/tags') && 'false' || 'true' }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || '_' }}-${{ matrix.python.version }}
          path: bindings/python/dist/*

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.x
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
